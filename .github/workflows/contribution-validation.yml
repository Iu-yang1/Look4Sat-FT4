name: Validate Look4Sat contribution

on:
  push:
    branches:
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and run source tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :core:data:testDebugUnitTest :feature:cw:testDebugUnitTest --no-daemon --stacktrace
