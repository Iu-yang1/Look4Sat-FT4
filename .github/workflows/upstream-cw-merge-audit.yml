name: Audit upstream merge preserving CW and L4S frequency control
on:
  push:
    branches: [integration/upstream-20261110-cw100]
    paths:
      - .github/workflows/upstream-cw-merge-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git three-way merge and conflict report
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/atsunatsu/Look4Sat.git
          git fetch --no-tags --depth=100 upstream d4b80126b5cc44fa45b0e6591dbb6a759f9f4512
          git config user.name 'Look4Sat Upstream Audit'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p mergerpt
          set +e
          git -c merge.conflictStyle=diff3 merge --no-commit --no-ff FETCH_HEAD > mergerpt/merge-output.txt 2>&1
          result=$?
          set -e
          echo "MERGE_RESULT=$result"
          cat mergerpt/merge-output.txt
          git diff --name-only --diff-filter=U | tee mergerpt/conflicted-files.txt
          printf 'UNMERGED_COUNT=%s\n' "$(wc -l < mergerpt/conflicted-files.txt)"
          printf 'AUTO_MERGED_FILES=%s\n' "$(git diff --cached --name-only | wc -l)"
          while IFS= read -r file; do
            echo "### CONFLICT FILE: $file"
            awk '/^<<<<<<< /{inside=1; count=0} inside{print;count++} /^>>>>>>> /{inside=0; print "---"} count>=65 {inside=0;print "[conflict truncated]"}' "$file" | head -n 170 || true
          done < mergerpt/conflicted-files.txt
          git diff --cached --name-only > mergerpt/auto-merged-paths.txt
      - name: Upload merge audit
        uses: actions/upload-artifact@v4
        with:
          name: upstream-merge-audit
          path: mergerpt/
