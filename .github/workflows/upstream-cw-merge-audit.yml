name: Integrate all upstream commits with reviewed CW conflict resolutions
on:
  push:
    branches: [integration/upstream-20261110-cw100]
    paths:
      - .github/workflows/upstream-cw-merge-audit.yml
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Three-way merge of all 69 commits and resolve reviewed hunks
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/atsunatsu/Look4Sat.git
          git fetch --no-tags --depth=100 upstream d4b80126b5cc44fa45b0e6591dbb6a759f9f4512
          set +e
          git -c merge.conflictStyle=diff3 merge --no-commit --no-ff FETCH_HEAD
          merge_status=$?
          set -e
          if [[ $merge_status != 0 && -z "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Merge failed without resolvable conflicts"
            exit 1
          fi
          python3 tools/resolve-upstream-20261110.py
          git add -A
          if [[ -n "$(git ls-files -u)" ]]; then
            echo "::error::Conflicted index entries remain"
            git ls-files -u
            exit 1
          fi
          git diff --cached --check
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- '*.kt' '*.xml' '*.c' '*.h' '*.toml'; then
            echo "::error::Unresolved conflict markers found"
            exit 1
          fi
          printf 'Merge parent commits:\n'
          git rev-parse HEAD FETCH_HEAD
          git diff --cached --stat | tail -45
      - name: Sign the upstream merge commit and push integration branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Look4Sat integration bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'Look4Sat integration bot <github-actions[bot]@users.noreply.github.com>' ed25519 sign 0
          signing_key=$(gpg --list-secret-keys --with-colons --keyid-format LONG | awk -F: '$1=="sec" { print $5; exit }')
          test -n "$signing_key"
          git config user.signingkey "$signing_key"
          git config commit.gpgsign true
          git commit -S -m 'merge: integrate atsunatsu upstream through d4b80126 preserving CW, CAT and logbook fixes'
          git show -s --format='%H %P %G?' HEAD
          git push origin HEAD:refs/heads/integration/upstream-20261110-cw100
