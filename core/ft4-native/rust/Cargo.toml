[package]
name = "look4sat-ft4"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libm = "=0.2.16"
mfsk-core = { git = "https://github.com/jl1nie/mfsk-core", rev = "707ebed2fb2290279e16ac79146c7a14df8b793b", default-features = false, features = ["std", "ft4", "jtty", "fft-rustfft"] }

[profile.release]
opt-level = 3
panic = "unwind"
lto = "thin"
codegen-units = 1

[workspace]
