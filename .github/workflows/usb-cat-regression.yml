name: USB CAT regression
on:
  push:
    branches:
      - 'fix/uvk1-usb-reconnect-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-usb-cat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android native components
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Compile Android and run radio reconnect tests
        run: ./gradlew --no-daemon :core:data:testDebugUnitTest :app:compileDebugKotlin
